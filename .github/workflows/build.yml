name: Build MSI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['website/**', 'assets/**', 'releases/**', 'macos/**', '.github/workflows/macos.yml', 'packaging/chocolatey/**', 'packaging/winget/**']
  pull_request:
    paths-ignore: ['website/**', 'assets/**', 'releases/**', 'macos/**', '.github/workflows/macos.yml', 'packaging/chocolatey/**', 'packaging/winget/**']
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to releases

jobs:
  build:
    runs-on: windows-latest
    # The app lives in source/; the website, logos and release files sit beside it.
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # version.json holds the version and channel. A tag must match it: v0.8.0-dev, v0.9.0-beta, v1.0.0.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $info = Get-Content version.json -Raw | ConvertFrom-Json
          $channel = $info.channel.ToLower()
          $label = (Get-Culture).TextInfo.ToTitleCase($channel)
          $tag = if ($channel -eq "stable") { "v$($info.version)" } else { "v$($info.version)-$channel" }
          $name = if ($channel -eq "stable") { $info.version } else { "$($info.version) $label" }
          if ($channel -ne "stable" -and [version]$info.targetStable -gt [version]"1.0.0") { $name += " (for $($info.targetStable))" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            Write-Error "Tag ${{ github.ref_name }} doesn't match version.json (expected $tag)."
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($channel -eq 'stable') { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      # Tagged builds are releases (attached below). Release builds, and every Beta or Stable build, need Ted's supporter
      # key and a changelog entry; files are named after the channel in version.json.
      - name: Build
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { ./build.ps1 -Release } else { ./build.ps1 }

      # Microsoft Store package (MSIX, 2026-10-26): the unsigned test package every build, and the Store upload package
      # once packaging/store/identity.json has the Partner Center identity. Neither goes on the GitHub release: the Store
      # copy reaches people through the Store, which signs it.
      - name: Build the Microsoft Store packages (MSIX)
        continue-on-error: true # never holds up the MSI and Portable ZIP
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          ../packaging/store/build-msix.ps1 -Publish publish -Out dist-store -Version $version
          ../packaging/store/build-msix.ps1 -Publish publish -Out dist-store -Version $version -Store

      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: KodiakCleaner-${{ steps.version.outputs.tag }}-msix-run${{ github.run_number }}
          path: source/dist-store/*
          retention-days: 7

      # Tagged releases go to the Microsoft Store too (Ted, 2026-10-26): the Store package is uploaded to Partner Center
      # and submitted for certification with Microsoft's msstore tool. Needs four repo secrets from Partner Center >
      # Account settings > User management > Microsoft Entra applications: MSSTORE_TENANT_ID, MSSTORE_SELLER_ID,
      # MSSTORE_CLIENT_ID and MSSTORE_CLIENT_SECRET. Skipped while any is missing. The Store refuses a new submission
      # while the previous one is still in certification; that only shows a warning and never fails the release.
      # The publish choice from the last submission carries over (Partner Center > Submission options).
      - name: Check the Microsoft Store secrets
        id: msstore
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $msix = "dist-store\KodiakCleaner-$version-x64-Store.msix"
          if (-not ($env:TENANT -and $env:SELLER -and $env:CLIENT -and $env:SECRET)) {
            Write-Output '::warning::The MSSTORE_* secrets aren''t all set, so the Microsoft Store submission was skipped.'
            'run=false' >> $env:GITHUB_OUTPUT; exit 0
          }
          if (-not (Test-Path $msix)) {
            Write-Output "::warning::$msix wasn't built, so the Microsoft Store submission was skipped."
            'run=false' >> $env:GITHUB_OUTPUT; exit 0
          }
          'run=true' >> $env:GITHUB_OUTPUT
          "msix=$((Resolve-Path $msix).Path)" >> $env:GITHUB_OUTPUT
          "storeId=$((Get-Content ../packaging/store/identity.json -Raw | ConvertFrom-Json).storeId)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5
        if: steps.msstore.outputs.run == 'true'
        with:
          dotnet-version: 9.0.x # the msstore tool runs on .NET 9

      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: steps.msstore.outputs.run == 'true'

      - name: Submit to the Microsoft Store
        if: steps.msstore.outputs.run == 'true'
        continue-on-error: true # a submission still in certification mustn't fail the release
        shell: pwsh
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSIX: ${{ steps.msstore.outputs.msix }}
          STORE_ID: ${{ steps.msstore.outputs.storeId }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE) { Write-Output '::warning::msstore couldn''t sign in to Partner Center. Check the MSSTORE_* secrets.'; exit 1 }
          msstore publish (Split-Path $env:MSIX) --inputFile $env:MSIX --appId $env:STORE_ID
          if ($LASTEXITCODE) { Write-Output '::warning::The Microsoft Store submission failed. If the last one is still in certification, submit this package by hand later (it''s in the msix artifact).'; exit 1 }
          Write-Output "::notice::Submitted $(Split-Path $env:MSIX -Leaf) to the Microsoft Store for certification."

      # Every build is also kept in releases/ and the download bucket, so this copy is short-lived, and a full artifact
      # store never fails the build.
      - uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: KodiakCleaner-${{ steps.version.outputs.tag }}-run${{ github.run_number }}
          path: source/dist/*
          retention-days: 2

      - name: Attach the MSI and Portable ZIP to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Kodiak Cleaner ${{ steps.version.outputs.name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: source/dist/*

      # GitHub's releases/latest skips pre-releases, so Dev and Beta builds also replace the files in one fixed release
      # (latest-dev or latest-beta). Docs\Download.url links there; the file names stay the same every build.
      - name: Update the fixed latest-dev or latest-beta release
        if: github.ref_type == 'tag' && steps.version.outputs.prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ steps.version.outputs.channel }}
          name: Kodiak Cleaner ${{ steps.version.outputs.label }} (newest build)
          body: The newest ${{ steps.version.outputs.label }} build, ${{ steps.version.outputs.name }}. Replaced by every ${{ steps.version.outputs.label }} release.
          prerelease: true
          files: source/dist/*
