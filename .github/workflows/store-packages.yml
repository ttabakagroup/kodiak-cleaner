name: Store Packages

# Sends a published Windows release to Chocolatey and Winget.
# Runs on its own after Create GitHub Release makes a new release, or by hand with Run workflow and a tag.
#
# Chocolatey: packs packaging/chocolatey/kodiak-cleaner (MSI inside) and kodiak-cleaner.portable (downloads the
#   Portable ZIP) from the release files and pushes both. Needs the repo secret CHOCOLATEY_API_KEY.
# Winget: opens a pull request on microsoft/winget-pkgs with wingetcreate for TedTabaka.KodiakCleaner. Needs the repo
#   secret WINGET_TOKEN (a classic GitHub token with public_repo) and the package already in winget-pkgs.
# A store whose secret isn't set is skipped. A version that's already there is skipped too.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.9.2-beta
        required: true
      stores:
        description: Which stores
        type: choice
        options: [both, chocolatey, winget]
        default: both

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  STORES: ${{ inputs.stores || 'both' }}

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      winget_version: ${{ steps.info.outputs.winget_version }}
      label: ${{ steps.info.outputs.label }}
      msi: ${{ steps.info.outputs.msi }}
      zip: ${{ steps.info.outputs.zip }}
    steps:
      - name: Read the release
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # v0.9.2-beta -> Chocolatey 0.9.2-beta, Winget 0.9.2. v1.0.0 -> 1.0.0 for both.
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-(beta|dev))?$ ]] || { echo "::error::Tag $TAG isn't like v0.9.2-beta or v1.0.0"; exit 1; }
          num=${BASH_REMATCH[1]}; channel=${BASH_REMATCH[3]}
          version=$num${channel:+-$channel}
          case "$channel" in beta) label="$num Beta" ;; dev) label="$num Dev" ;; *) label="$num" ;; esac
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          msi=$(grep -E '^KodiakCleaner-.*Setup\.msi$' <<<"$assets" | head -1 || true)
          zip=$(grep -E '^KodiakCleaner-.*Portable\.zip$' <<<"$assets" | head -1 || true)
          [ -n "$msi" ] && [ -n "$zip" ] || { echo "::error::Release $TAG needs a ...Setup.msi and a ...Portable.zip"; exit 1; }
          {
            echo "version=$version"; echo "winget_version=$num"; echo "label=$label"; echo "msi=$msi"; echo "zip=$zip"
          } >> "$GITHUB_OUTPUT"
          echo "Release $TAG: Chocolatey $version, Winget $num, $msi, $zip"

  chocolatey:
    needs: release-info
    runs-on: windows-latest   # comes with Chocolatey
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      VERSION: ${{ needs.release-info.outputs.version }}
      LABEL: ${{ needs.release-info.outputs.label }}
      MSI: ${{ needs.release-info.outputs.msi }}
      ZIP: ${{ needs.release-info.outputs.zip }}
    steps:
      - name: Check the API key
        id: key
        shell: pwsh
        run: |
          if ($env:STORES -eq 'winget') { 'run=false' >> $env:GITHUB_OUTPUT; exit 0 }
          if (-not $env:CHOCOLATEY_API_KEY) {
            Write-Output '::warning::CHOCOLATEY_API_KEY isn''t set, so Chocolatey was skipped.'
            'run=false' >> $env:GITHUB_OUTPUT; exit 0
          }
          'run=true' >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v5
        if: steps.key.outputs.run == 'true'
        with:
          sparse-checkout: packaging

      - name: Download the release files
        if: steps.key.outputs.run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY -p $env:MSI -p $env:ZIP -D dl
          if ($LASTEXITCODE) { exit 1 }

      - name: Fill in and pack both packages
        if: steps.key.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msiSha = (Get-FileHash "dl\$env:MSI" -Algorithm SHA256).Hash
          $zipSha = (Get-FileHash "dl\$env:ZIP" -Algorithm SHA256).Hash
          $note = if ($env:VERSION -match '-') { "**Note:** this is a $($env:LABEL.Split(' ')[1].ToLower()) build. Use at your own risk." } else { '' }
          $values = [ordered]@{
            '__MSI_SHA256__' = $msiSha; '__ZIP_SHA256__' = $zipSha; '__MSI__' = $env:MSI; '__ZIP__' = $env:ZIP
            '__TAG__' = $env:TAG; '__VERSION__' = $env:VERSION; '__LABEL__' = $env:LABEL
            '__NOTE__' = $note
          }
          New-Item -ItemType Directory out | Out-Null
          foreach ($pkg in 'kodiak-cleaner', 'kodiak-cleaner.portable') {
            $dir = "build\$pkg"
            Copy-Item "packaging\chocolatey\$pkg" $dir -Recurse
            Get-ChildItem $dir -Recurse -File -Include *.nuspec, *.ps1, *.txt | Where-Object Name -ne 'LICENSE.txt' | ForEach-Object {
              $text = [IO.File]::ReadAllText($_.FullName)
              foreach ($k in $values.Keys) { $text = $text.Replace($k, $values[$k]) }
              [IO.File]::WriteAllText($_.FullName, $text)
            }
            if ($pkg -eq 'kodiak-cleaner') { Copy-Item "dl\$env:MSI" "$dir\tools\" }
            $left = Select-String -Path "$dir\*.nuspec", "$dir\tools\*" -Pattern '__[A-Z0-9_]+__' -Exclude *.msi
            if ($left) { throw "Placeholders left in $pkg`: $left" }
            choco pack "$dir\$pkg.nuspec" --out out
            if ($LASTEXITCODE) { throw "choco pack failed for $pkg" }
          }
          Get-ChildItem out

      - name: Push to Chocolatey
        if: steps.key.outputs.run == 'true'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($pkg in 'kodiak-cleaner', 'kodiak-cleaner.portable') {
            $file = "out\$pkg.$env:VERSION.nupkg"
            $log = choco push $file --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
            Write-Output $log
            if ($LASTEXITCODE) {
              # Pushing a version that's already approved is refused; that's fine when the workflow runs again.
              if ($log -match '409|already exists|Conflict') { Write-Output "::notice::$pkg $env:VERSION is already on Chocolatey." }
              else { Write-Output "::error::Pushing $pkg failed."; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.run == 'true'
        with:
          name: chocolatey-packages
          path: out/*.nupkg

  winget:
    needs: release-info
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      WINGET_VERSION: ${{ needs.release-info.outputs.winget_version }}
      MSI: ${{ needs.release-info.outputs.msi }}
    steps:
      - name: Submit to Winget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:STORES -eq 'chocolatey') { exit 0 }
          if (-not $env:WINGET_TOKEN) { Write-Output '::warning::WINGET_TOKEN isn''t set, so Winget was skipped.'; exit 0 }
          $id = 'TedTabaka.KodiakCleaner'
          $headers = @{ Authorization = "Bearer $env:WINGET_TOKEN"; 'User-Agent' = 'kodiakcleaner-store-packages' }

          # Skip a version that's already in winget-pkgs or already waiting in an open pull request.
          try {
            Invoke-RestMethod -Headers $headers "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/t/TedTabaka/KodiakCleaner/$env:WINGET_VERSION" | Out-Null
            Write-Output "::notice::$id $env:WINGET_VERSION is already in winget-pkgs."; exit 0
          } catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          $q = [uri]::EscapeDataString("repo:microsoft/winget-pkgs is:pr is:open in:title $id $env:WINGET_VERSION")
          $open = Invoke-RestMethod -Headers $headers "https://api.github.com/search/issues?q=$q"
          if ($open.total_count -gt 0) { Write-Output "::notice::A pull request for $id $env:WINGET_VERSION is already open: $($open.items[0].html_url)"; exit 0 }

          # wingetcreate update needs the package to be in winget-pkgs already (the first version is submitted by hand).
          try { Invoke-RestMethod -Headers $headers 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/t/TedTabaka/KodiakCleaner' | Out-Null }
          catch { Write-Output "::warning::$id isn't in winget-pkgs yet (the first pull request may still be in review), so Winget was skipped."; exit 0 }

          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/$env:MSI"
          .\wingetcreate.exe update $id --version $env:WINGET_VERSION --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE) { throw 'wingetcreate update failed' }
